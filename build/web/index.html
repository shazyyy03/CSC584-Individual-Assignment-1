<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Personal Profile Form</title>

    <link rel="stylesheet"
          href="css/style.css?v=70">
</head>

<body>

    <main class="page-container">

        <section class="profile-layout">

            <!-- Purple left panel -->
            <div class="welcome-panel">

                <div class="welcome-content">

                    <h1>Welcome!</h1>

                    <p>
                        Create your personal profile by
                        completing the form.
                    </p>

                </div>

            </div>

            <!-- White right panel -->
            <div class="form-panel">

                <form action="ProfileServlet"
                      method="post">

                    <div class="form-heading">

                        <h2>Personal Profile Form</h2>

                        <p>
                            Please enter your personal information.
                        </p>

                    </div>

                    <div class="form-group">

                        <label for="name">Name</label>

                        <input type="text"
                               id="name"
                               name="name"
                               required>

                    </div>

                    <div class="form-group">

                        <label for="studentId">
                            Student ID
                        </label>

                        <input type="text"
                               id="studentId"
                               name="studentId"
                               required>

                    </div>

                    <div class="form-group">

                        <label for="programme">
                            Program
                        </label>

                        <input type="text"
                               id="programme"
                               name="programme"
                               required>

                    </div>

                    <div class="form-group">

                        <label for="email">Email</label>

                        <input type="email"
                               id="email"
                               name="email"
                               required>

                    </div>

                    <div class="form-group">

                        <label for="hobbies">Hobbies</label>

                        <input type="text"
                               id="hobbies"
                               name="hobbies"
                               required>

                    </div>

                    <div class="form-group">

                        <label for="introduction">Bio</label>

                        <textarea id="introduction"
                                  name="introduction"
                                  rows="4"
                                  required></textarea>

                    </div>

                    <input type="submit"
                           value="SUBMIT PROFILE">

                </form>

            </div>

        </section>

    </main>

</body>

</html>
